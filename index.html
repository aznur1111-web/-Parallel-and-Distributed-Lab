  ["Herlihy and Shavit, The Art of Multiprocessor Programming, 2nd ed., Morgan Kaufmann 2020","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"]]},
{id:"amdahl-gustafson",title:"Amdahl's and Gustafson's laws",level:2,kind:"Foundation",status:"Runnable teaching lab",
 summary:"Amdahl's law bounds speedup for a fixed problem size. Gustafson's law gives the scaled speedup when the problem grows with the hardware.",
 mental:"The serial part is a ceiling on speedup",
 mentalText:"If 10% of the work must run serially, no amount of parallelism can give more than 10x speedup, no matter how many cores you use.",
 steps:["Measure or estimate the serial fraction s.","Compute speedup(P) = 1 / (s + (1-s)/P).","For scaled speedup, use Gustafson: s + (1-s) * P.","Choose core count based on the actual limit."],
 pseudo:"Amdahl's law (fixed size):\n  T(1) = s + (1 - s)\n  T(P) = s + (1 - s) / P\n  speedup(P) = T(1) / T(P) = 1 / (s + (1-s)/P)\n\nLimit as P -> infinity: 1 / s\n\nGustafson's law (scaled size):\n  speedup_scaled(P) = s + (1 - s) * P\n\nWork and span:\n  work W, span S\n  parallelism P = W / S\n  speedup on unlimited processors <= P",
 uses:"Capacity planning, choosing core count, understanding scaling limits.",
 strength:"Simple formulas that guide design decisions.",
 limits:"Real systems have overhead that the simple formulas ignore.",
 pitfall:"Amdahl's law assumes a fixed problem size. If the problem grows with the hardware, Gustafson gives a more useful bound.",
 question:"If the serial fraction is 5%, what is the maximum speedup?",
 answer:"20x. 1 / 0.05 = 20.",
 demo:"amdahl",sample:"0.1\n4\n16",refs:[
  ["Amdahl, Validity of the single processor approach, AFIPS 1967","https://doi.org/10.1145/1465482.1465560"],
  ["Gustafson, Reevaluating Amdahl's law, CACM 1988","https://doi.org/10.1145/42411.42415"],
  ["Hill, Marty, Mark, et al., Amdahl's law in the multicore era, IEEE Computer 2008","https://doi.org/10.1109/MC.2008.209"]]},
{id:"race-conditions",title:"Race conditions and data races",level:3,kind:"Foundation",status:"Runnable teaching lab",
 summary:"A data race occurs when two threads access the same memory location concurrently and at least one writes, without synchronization. A race condition is a broader bug where the result depends on timing.",
 mental:"Two threads tripping over each other",
 mentalText:"If two threads increment the same counter without a lock, the final value depends on the exact interleaving. Both increments read and write, and one can overwrite the other.",
 steps:["Identify shared mutable state.","Check every access for synchronization.","Use atomics, locks or thread-local state.","Test under stress and with sanitizers."],
 pseudo:"Data race: two threads access the same location, at least one writes,\n           no synchronization.\n\nRace condition: a broader timing-dependent bug.\n\nExample (broken counter):\n  counter = 0   shared\n  thread A: counter += 1\n  thread B: counter += 1\n\n  The read-modify-write is not atomic.\n  Possible interleavings:\n    A read 0, B read 0, A write 1, B write 1 -> 1 (lost update)\n    A read 0, A write 1, B read 1, B write 2 -> 2 (correct)\n\nFixes:\n  atomic increment\n  mutex around the counter\n  per-thread counters, summed at the end\n\nTools:\n  ThreadSanitizer, Helgrind, race condition detectors",
 uses:"Every concurrent program. Detecting races is hard; preventing them is easier.",
 strength:"Recognizing races is the first step to fixing them.",
 limits:"Not all races are data races. Atomicity, order and visibility are separate concerns.",
 pitfall:"A test that passes today can fail tomorrow under different load. Race conditions are often non-deterministic.",
 question:"What is a data race?",
 answer:"Two threads accessing the same memory location concurrently, at least one writing, without synchronization.",
 demo:"race",sample:"1000\n8",refs:[
  ["Adve and Gharachorloo, Shared memory consistency models: a tutorial, IEEE Computer 1996","https://doi.org/10.1109/2.546611"],
  ["Boehm and Adve, Foundations of the C++ concurrency memory model, PLDI 2008","https://doi.org/10.1145/1375581.1375591"],
  ["Herlihy and Shavit, The Art of Multiprocessor Programming, Chapter 1","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"]]},

{id:"map-reduce",title:"Map and reduce",level:2,kind:"Parallel primitive",status:"Runnable teaching lab",
 summary:"Map applies a function to every element independently. Reduce combines elements into a single value using an associative operation. Together they express most parallel data processing.",
 mental:"Apply and combine",
 mentalText:"Map is embarrassingly parallel: every element is independent. Reduce needs associativity so you can combine in any grouping.",
 steps:["Split the data into chunks.","Map each chunk independently.","Combine partial results with an associative reduce.","Return the final value."],
 pseudo:"map(f, [x1, x2, ..., xn]) = [f(x1), f(x2), ..., f(xn)]\n\nreduce(op, [x1, ..., xn]) = x1 op x2 op ... op xn\n  op must be associative: (a op b) op c = a op (b op c)\n  if op is also commutative, order does not matter\n\nParallel reduce (tree):\n  level 1: combine adjacent pairs\n  level 2: combine pairs of pairs\n  ...\n  log n levels, n/2 + n/4 + ... = n - 1 combines\n\nMapReduce (Google 2004):\n  map(k1, v1) -> list(k2, v2)\n  reduce(k2, list(v2)) -> list(v3)\n  shuffle groups by key between map and reduce",
 uses:"Data parallel languages, GPU kernels, Spark RDDs, Hadoop MapReduce, MapReduce-style frameworks.",
 strength:"Map is trivially parallel. Reduce parallelizes with a tree.",
 limits:"Reduce requires an associative operation. Non-associative float addition gives different results depending on tree shape.",
 pitfall:"Floating-point addition is not associative. Changing the reduction order changes the result.",
 question:"Why does reduce need associativity?",
 answer:"The reduce combines partial results in any order. Without associativity, the final result depends on the grouping.",
 demo:"reduce",sample:"1 2 3 4 5 6 7 8",refs:[
  ["Dean and Ghemawat, MapReduce: simplified data processing on large clusters, OSDI 2004","https://research.google/pubs/pub62/"],
  ["Blelloch, Prefix sums and their applications, CMU-CS-90-190, 1990","https://www.cs.cmu.edu/~guyb/papers/Ble93.pdf"],
  ["Zaharia et al., Resilient distributed datasets: a fault-tolerant abstraction for in-memory cluster computing, NSDI 2012","https://www.usenix.org/conference/nsdi12/technical-sessions/presentation/zaharia"]]},
{id:"scan-prefix",title:"Scan and prefix sum",level:3,kind:"Parallel primitive",status:"Runnable teaching lab",
 summary:"A scan computes the running prefix of an operation over a sequence. The exclusive scan gives prefix sums; the inclusive scan gives prefix sums including the current element.",
 mental:"Running totals",
 mentalText:"Exclusive scan of [a, b, c] with addition gives [0, a, a+b]. Inclusive gives [a, a+b, a+b+c].",
 steps:["Choose inclusive or exclusive.","Choose an associative operator.","Apply either Hillis-Steele (fast but more work) or Blelloch (less work).","Return the prefix sequence."],
 pseudo:"Inclusive scan: y[i] = x[0] op x[1] op ... op x[i]\nExclusive scan: y[i] = x[0] op ... op x[i-1], y[0] = identity\n\nHillis-Steele (inclusive):\n  for d = 1, 2, 4, ..., < n:\n    for i in parallel:\n      if i >= d: y[i] = y[i-d] op y[i]\n  work: O(n log n), span: O(log n)\n\nBlelloch (work-efficient):\n  up-sweep (reduce): O(n) work, O(log n) span\n  down-sweep: O(n) work, O(log n) span\n  total: O(n) work, O(log n) span\n\nApplications:\n  prefix sums, compaction, stream compaction,\n  radix sort digit counts, quicksort partitioning, polynomial evaluation",
 uses:"Parallel sorting, compaction, radix sort, GPU libraries, functional programming.",
 strength:"Reduces a sequential O(n) loop to a parallel O(log n) depth computation.",
 limits:"Two scans (Blelloch) are more work-efficient but more complex than Hillis-Steele.",
 pitfall:"Exclusive vs inclusive off-by-one. Always double-check the definition used by your library.",
 question:"What is the work and span of the Blelloch scan?",
 answer:"Work is O(n), span is O(log n).",
 demo:"scan",sample:"3 1 4 1 5 9 2 6",refs:[
  ["Blelloch, Prefix sums and their applications, CMU-CS-90-190, 1990","https://www.cs.cmu.edu/~guyb/papers/Ble93.pdf"],
  ["Hillis and Steele, Data parallel algorithms, CACM 1986","https://doi.org/10.1145/7902.7903"],
  ["Harris, Sengupta, Owens, Parallel prefix sum (scan) with CUDA, GPU Gems 3, 2007","https://developer.nvidia.com/gpugems/gpugems3/part-vi-gpu-computing/chapter-39-parallel-prefix-sum-scan-cuda"]]},
{id:"blelloch-hillis",title:"Blelloch vs Hillis-Steele scan",level:4,kind:"Parallel primitive",status:"Runnable teaching lab",
 summary:"Hillis-Steele is simple with O(n log n) work. Blelloch is more complex with O(n) work but more synchronization steps.",
 mental:"More work or more parallelism",
 mentalText:"Hillis-Steele does more total work but has fewer dependency levels. Blelloch does less work at the cost of a more intricate pattern.",
 steps:["Hillis-Steele: at each step d = 1, 2, 4, ..., combine y[i-d] with y[i] for i >= d.","Blelloch: up-sweep reduces partial sums, then down-sweep distributes prefixes.","Both have span O(log n).","Hillis-Steele uses O(n log n) work; Blelloch uses O(n)."],
 pseudo:"Hillis-Steele (inclusive scan):\n  x = input\n  for d = 1; d < n; d *= 2:\n    for i in parallel 0..n-1:\n      if i >= d: x[i] += x[i-d]\n  return x\n  Work O(n log n), span O(log n)\n\nBlelloch (exclusive scan):\n  # up-sweep\n  for d = 1; d < n; d *= 2:\n    for i in parallel 0..n/d - 1:\n      x[2*i*d + 2*d - 1] += x[2*i*d + d - 1]\n  # set last to 0, then down-sweep\n  x[n-1] = 0\n  for d = n/2; d >= 1; d /= 2:\n    for i in parallel 0..n/d - 1:\n      tmp = x[2*i*d + d - 1]\n      x[2*i*d + d - 1] = x[2*i*d + 2*d - 1]\n      x[2*i*d + 2*d - 1] += tmp\n  return x\n  Work O(n), span O(log n)",
 uses:"Parallel libraries, GPU kernels, high-performance sorting and compaction.",
 strength:"Blelloch is work-optimal. Hillis-Steele is simpler.",
 limits:"Both require an associative operator.",
 pitfall:"Blelloch is exclusive. If you need inclusive, add the original element back.",
 question:"Which scan is more work-efficient?",
 answer:"Blelloch. It uses O(n) work versus O(n log n) for Hillis-Steele.",
 demo:"blelloch",sample:"3 1 4 1 5 9 2 6",refs:[
  ["Blelloch, Prefix sums and their applications, CMU-CS-90-190, 1990","https://www.cs.cmu.edu/~guyb/papers/Ble93.pdf"],
  ["Harris, Sengupta, Owens, Parallel prefix sum (scan) with CUDA, GPU Gems 3, 2007","https://developer.nvidia.com/gpugems/gpugems3/part-vi-gpu-computing/chapter-39-parallel-prefix-sum-scan-cuda"],
  ["Yan, Wang, Zhang, Optimizing parallel prefix on GPUs, 2016","https://doi.org/10.1109/TPDS.2015.2406878"]]},

{id:"mutex-semaphore",title:"Mutexes and semaphores",level:2,kind:"Coordination",status:"Runnable teaching lab",
 summary:"A mutex allows only one thread into a critical section. A semaphore is a counter that blocks threads when the counter reaches zero.",
 mental:"A key to a single room, or a set of tickets to a parking lot",
 mentalText:"A mutex has one key. A semaphore has N tickets; when tickets are gone, waiters must wait until one is returned.",
 steps:["Identify the critical section.","Choose a mutex for mutual exclusion, or a semaphore for counting.","Acquire before, release after.","Avoid holding the lock longer than needed."],
 pseudo:"Mutex:\n  lock(m): wait until m is free, then take it\n  unlock(m): release m, wake one waiter\n\nSemaphore:\n  init(s, k): s starts at k\n  wait(s): if s > 0, s -= 1; else block\n  signal(s): if a thread is blocked, wake it; else s += 1\n\nBinary semaphore == mutex in behavior but not in\nall implementations.\n\nDeadlock conditions (Coffman):\n  mutual exclusion, hold and wait, no preemption, circular wait",
 uses:"Protecting shared state, producer-consumer, resource pools, throttling.",
 strength:"Simple primitives for coordination.",
 limits:"Easy to misuse. Deadlock, priority inversion, and lock contention are common.",
 pitfall:"Forgetting to release a lock on all paths (including exceptions) causes deadlock.",
 question:"How is a semaphore different from a mutex?",
 answer:"A mutex is binary (locked or unlocked). A semaphore has a counter and can allow N concurrent users.",
 demo:"producer-consumer",sample:"3\n5",refs:[
  ["Dijkstra, Cooperating sequential processes, 1965","https://www.cs.utexas.edu/users/EWD/transcriptions/EWD01xx/EWD123.html"],
  ["Herlihy and Shavit, The Art of Multiprocessor Programming, Chapter 8","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"],
  ["Tanenbaum and Bos, Modern Operating Systems, 4th ed., Pearson 2014","https://www.pearson.com/en-us/subject-catalog/p/modern-operating-systems/P200000003292"]]},
{id:"barriers-conditions",title:"Barriers and condition variables",level:3,kind:"Coordination",status:"Runnable teaching lab",
 summary:"A barrier makes every thread wait until all threads arrive. A condition variable lets a thread wait for a condition to become true, releasing the lock while waiting.",
 mental:"A finish line for all runners, or a waiting room",
 mentalText:"At a barrier, every thread arrives before any proceeds. A condition variable is a waiting room with a signal bell.",
 steps:["Use a barrier to synchronize phases.","Use a condition variable with a mutex to wait for a predicate.","Always re-check the predicate after waking.","Signal or broadcast when the state changes."],
 pseudo:"Barrier:\n  arrive(b): count += 1\n  if count == N: release all waiters, reset count\n  else: wait\n\nCondition variable:\n  wait(cv, m): atomically unlock m and block; on wake, re-lock m\n  signal(cv): wake one waiter\n  broadcast(cv): wake all waiters\n\nCorrect usage:\n  lock(m)\n  while not condition:\n    wait(cv, m)\n  # predicate is true, proceed\n  unlock(m)\n\nSpurious wakeups: a wait may return without signal.\nAlways re-check the predicate in a loop.",
 uses:"Synchronizing phases of parallel algorithms, producer-consumer queues, event handling.",
 strength:"Express complex coordination with two primitives.",
 limits:"Easy to miss a signal or deadlock. Correctness requires careful reasoning.",
 pitfall:"Using if instead of while around wait(). Spurious wakeups cause wrong behavior.",
 question:"Why do condition variable waits need a loop?",
 answer:"Spurious wakeups can return without a signal. The predicate must be re-checked.",
 demo:"barrier",sample:"4\n8",refs:[
  ["Hoare, Monitors: an operating system structuring concept, CACM 1974","https://doi.org/10.1145/355620.361161"],
  ["Herlihy and Shavit, Chapter 8 Monitors and Blocking Synchronization","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"],
  ["Coffman, Elphick, Shoshani, System deadlocks, ACM Computing Surveys 1971","https://doi.org/10.1145/356586.356588"]]},
{id:"atomics-cas",title:"Atomic operations and compare-and-swap",level:4,kind:"Coordination",status:"Runnable teaching lab",
 summary:"Atomic operations execute indivisibly with respect to other threads. Compare-and-swap (CAS) atomically checks a value and updates it. It is the foundation of lock-free data structures.",
 mental:"Check and update in one indivisible step",
 mentalText:"CAS(m, expected, new) returns true and writes new only if the current value equals expected. Otherwise it fails and you retry.",
 steps:["Read the current value.","Compute a new value.","CAS from the old value to the new.","If CAS fails, retry from the current value."],
 pseudo:"CAS(ptr, expected, new):\n  atomically:\n    if *ptr == expected:\n      *ptr = new; return true\n    else:\n      return false\n\nFetch-and-add:\n  atomically: old = *ptr; *ptr = old + delta; return old\n\nLock-free counter with CAS:\n  while True:\n    old = counter\n    if CAS(counter, old, old + 1): break\n\nABA problem:\n  thread 1 reads A\n  thread 2 changes A -> B -> A\n  thread 1 CAS succeeds on the recycled A\n  but the underlying state has changed\n\nSolutions: tagged pointers, hazard pointers, epoch reclamation.",
 uses:"Lock-free data structures, GPU atomics, concurrent counters, memory allocators.",
 strength:"Building block for lock-free and wait-free algorithms.",
 limits:"Complex to use correctly. ABA problem is a classic pitfall.",
 pitfall:"CAS loop with an unbounded retry can livelock under heavy contention.",
 question:"What is the ABA problem?",
 answer:"A CAS sees the same value A but the state has changed to B and back. The CAS succeeds even though the logical state changed.",
 demo:"cas-counter",sample:"1000\n8",refs:[
  ["Herlihy, Wait-free synchronization, ACM TOPLAS 1991","https://doi.org/10.1145/114005.102808"],
  ["Herlihy and Shavit, Chapter 5 The Relative Power of Primitive Synchronization Operations","https://www.sciencedirect.com/book/9780124159501/the-art-of-multiprocessor-programming"],
  ["Michael, Hazard pointers: safe memory reclamation for lock-free objects, IEEE TPDS 2004","https://doi.org/10.1109/TPDS.2004.8"]]},

{id:"fork-join",title:"Fork-join",level:3,kind:"Work distribution",status:"Runnable teaching lab",
 summary:"Fork-join spawns parallel tasks and joins their results. The runtime schedules tasks on worker threads, usually with work stealing.",
 mental:"Split the work, then combine the results",
 mentalText:"Fork creates a new task. Join waits for the task's result. Divide and conquer parallelizes naturally this way.",
 steps:["Split the problem into independent subtasks.","Fork each subtask.","Join each subtask to collect results.","Combine the results.","Optionally set a base-case threshold."],
 pseudo:"fork_join(problem):\n  if problem is small:\n    solve sequentially\n  else:\n    split into (left, right)\n    l = fork(fork_join(left))\n    r = fork(fork_join(right))\n    return combine(join(l), join(r))\n\nWork and span:\n  Work T(n) = 2 T(n/2) + O(1) = O(n)\n  Span S(n) = S(n/2) + O(1) = O(log n)\n  Parallelism = T / S = O(n / log n)\n\nJava ForkJoinPool, .NET TPL, Cilk, OpenMP tasks\nall use some form of this model.",
 uses:"Divide and conquer algorithms, parallel merge sort, quicksort, matrix multiply.",
 strength:"Simple model for recursive parallelism.",
 limits:"Task overhead. Small tasks do not pay off.",
 pitfall:"Too many tiny tasks. Use a sequential base case.",
 question:"Why is work per task important in fork-join?",
 answer:"If tasks are too small, the scheduling overhead exceeds the work.",
 demo:"fork-join",sample:"16\n4",refs:[
  ["Lea, A Java fork/join framework, JavaOne 2000","https://gee.cs.oswego.edu/dl/papers/fj.pdf"],
  ["Blumofe and Leiserson, Scheduling multithreaded computations by work stealing, JACM 1999","https://doi.org/10.1145/324133.324234"],
  ["Frigo, Leiserson, Randall, The implementation of the Cilk-5 multithreaded language, PLDI 1998","https://doi.org/10.1145/277650.277725"]]},
{id:"work-stealing",title:"Work stealing",level:4,kind:"Scheduling",status:"Runnable teaching lab",
 summary:"Each worker thread has a deque of tasks. It pops from its own end. When idle, it steals from the other end of another worker's deque. This balances load with low contention.",
 mental:"Each worker has a stack; idle workers steal from the bottom of others",
 mentalText:"Idle workers do not sit still. They steal the oldest task from a busy worker, which is likely the biggest one.",
 steps:["Each worker maintains a deque.","Owner pushes and pops at the bottom (local).","Thief steals from the top (remote).","Retry if the steal races with the owner."],
 pseudo:"Owner operations (LIFO, local):\n  push_bottom(task)\n  t = pop_bottom()\n\nThief operations (FIFO, remote):\n  t = steal_top()\n\nWhy it works:\n  bottom is hot in the owner's cache\n  stealers access the top, avoiding contention\n  top of the deque holds the oldest (largest) task\n\nLoad balancing:\n  near-optimal for series-parallel computations\n  expected O(T_1 / P + T_infinity) time\n\nUsed in:\n  Java ForkJoinPool\n  Go scheduler\n  Rust Rayon\n  Intel TBB\n  Cilk, X10, Chapel",
 uses:"Runtime systems for parallel languages, task scheduling on multicore.",
 strength:"Near-optimal load balancing with low overhead.",
 limits:"Steal attempts cost. Small tasks make stealing less effective.",
 pitfall:"LIFO on the owner + FIFO on the thief is what makes stealing effective. Reversing this increases contention.",
 question:"Why do owners and thieves take from opposite ends?",
 answer:"Owners use the hot bottom end; thieves use the cold top end. This reduces contention and the thieves get larger tasks.",
 demo:"work-stealing",sample:"8\n64",refs:[
  ["Blumofe and Leiserson, Scheduling multithreaded computations by work stealing, JACM 1999","https://doi.org/10.1145/324133.324234"],
  ["Arora, Blumofe, Plaxton, Thread scheduling for multiprogrammed multiprocessors, SPAA 1998","https://doi.org/10.1145/277651.277678"],
  ["Lea, A Java fork/join framework, JavaOne 2000","https://gee.cs.oswego.edu/dl/papers/fj.pdf"]]},
{id:"bsp",title:"Bulk-synchronous parallel",level:4,kind:"Model",status:"Concept lesson",
 summary:"The BSP model organizes computation into supersteps: local computation, then communication, then a barrier. It simplifies reasoning about parallel algorithms.",
 mental:"Compute, communicate, synchronize, repeat",
 mentalText:"Every superstep has a compute phase, a communication phase, and a barrier. Between supersteps, the state is consistent.",
 steps:["Each process computes locally.","Exchange messages.","Barrier synchronize.","Repeat until done."],
 pseudo:"BSP superstep:\n  1. Local computation on local data\n  2. Communication (send/receive messages)\n  3. Barrier (all processes reach the same point)\n\nCost model:\n  cost of a superstep = w + h g + l\n  w = max work per process\n  h = max messages per process\n  g = cost per message\n  l = barrier cost\n\nAdvantages:\n  simple reasoning\n  predictable performance\n  matches BSP libraries (Pregel, Giraph)\n\nDisadvantages:\n  barriers are expensive\n  load imbalance hurts\n  no overlap of compute and communication",
 uses:"Graph processing (Pregel), scientific computing, distributed algorithms with clear phases.",
 strength:"Simple model that matches many real systems.",
 limits:"Barriers limit overlap. Not ideal for fine-grained parallelism.",
 pitfall:"Assuming the barrier is free. On large clusters it can dominate.",
 question:"What is a superstep?",
 answer:"A phase of local computation followed by communication and a barrier.",
 demo:"bsp",sample:"4\n3",refs:[
  ["Valiant, A bridging model for parallel computation, CACM 1990","https://doi.org/10.1145/79173.79181"],
  ["Malewicz et al., Pregel: a system for large-scale graph processing, SIGMOD 2010","https://doi.org/10.1145/1807167.1807184"],
  ["Cheatham, Fahmy, Stefanescu, Bulk synchronous parallel computing, 1996","https://doi.org/10.1007/BFb0027064"]]},

{id:"parallel-reduction",title:"Parallel reduction",level:3,kind:"Parallel numerical",status:"Runnable teaching lab",
 summary:"Parallel reduction combines values with an associative operator using a tree. Work is O(n), span is O(log n).",
 mental:"A tournament bracket",
 mentalText:"Combine pairs, then pairs of pairs, until one value remains.",
 steps:["Split the input into blocks.","Reduce each block sequentially or with another tree level.","Combine the block results with a tree.","Return the root."],
 pseudo:"tree_reduce(a, op):\n  n = len(a)\n  while n > 1:\n    for i in parallel 0..n/2-1:\n      a[i] = op(a[2*i], a[2*i+1])\n    n = n / 2\n  return a[0]\n\nWork: O(n)\nSpan: O(log n)\n\nFor sum:\n  pairs are independent\n  order of operations affects the result for floats\n\nPractical reduction on GPUs:\n  each thread reduces a strided chunk\n  block-level tree reduce in shared memory\n  grid-level reduce with atomics or a second pass",
 uses:"Sum, product, min, max, any, all, plus any associative operation.",
 strength:"Logarithmic depth. Efficient.",
 limits:"Not every operation is associative. Floating-point is a classic non-associative case.",
 pitfall:"Changing the reduction order changes floating-point results. Use compensated summation or fix the tree shape.",
 question:"What is the span of a parallel tree reduction on n elements?",
 answer:"O(log n) tree levels.",
 demo:"reduce",sample:"1 2 3 4 5 6 7 8",refs:[
  ["Blelloch, Prefix sums and their applications, CMU-CS-90-190, 1990","https://www.cs.cmu.edu/~guyb/papers/Ble93.pdf"],
  ["Harris, Optimizing parallel reduction in CUDA, NVIDIA developer documentation","https://developer.download.nvidia.com/compute/cuda/1.1-Beta/x86_website/projects/reduction/doc/reduction.pdf"],
  ["Higham, Accuracy and Stability of Numerical Algorithms, SIAM 2002","https://epubs.siam.org/doi/book/10.1137/1.9780898718027"]]},
{id:"parallel-matmul",title:"Parallel matrix multiplication",level:4,kind:"Parallel numerical",status:"Runnable teaching lab",
 summary:"Parallel matrix multiplication divides the output into tiles. Each processor computes one or more tiles by fetching the corresponding rows of A and columns of B.",
 mental:"Every output tile gets its own worker",
 mentalText:"Split C into blocks. Each worker computes one block from a row band of A and a column band of B. Independent tiles run in parallel.",
 steps:["Partition A, B and C into tiles.","Assign tiles to workers.","Each worker computes its tile.","Distribute and combine the output."],
 pseudo:"Naive parallel matmul (block algorithm):\n  partition A (m x k) and B (k x n) into blocks\n  partition C into a p x q grid of tiles\n  each worker owns tile C[i][j]\n  for each k-step:\n    fetch A[i][k] and B[k][j]\n    C[i][j] += A[i][k] * B[k][j]\n\nCost model:\n  compute per worker: O(n^3 / P) for P workers\n  communication: O(n^2 * p) for a p x p grid\n  ratio matters: compute / communication should be high\n\nCannon: shift A left, B up, multiply locally, repeat\nSUMMA: broadcast A column and B row, multiply, repeat\nBoth avoid the naive all-to-all communication.",
 uses:"Scientific computing, deep learning, graphics, ML training.",
 strength:"Embarrassingly parallel in output tiles. Blocked algorithms fit cache well.",
 limits:"Communication dominates for small tiles or many nodes.",
 pitfall:"Choosing tile size without regard to cache or network. Tile too small means too much communication.",
 question:"Why are blocked algorithms preferred over the naive three-loop implementation?",
 answer:"Blocking improves cache locality and enables communication-efficient distribution.",
 demo:"parallel-matmul",sample:"4\n2",refs:[
  ["Cannon, A cellular computer to implement the Kalman filter, PhD thesis, Montana State University 1969","https://scholarworks.montana.edu/xmlui/handle/1/1452"],
  ["Van de Geijn and Watts, SUMMA: scalable universal matrix multiplication algorithm, Concurrency: Practice and Experience 1997","https://doi.org/10.1002/(SICI)1096-9128(199704)9:4<255::AID-CPE250>3.0.CO;2-2"],
  ["Golub and Van Loan, Matrix Computations, 4th ed., Johns Hopkins 2013","https://jhupbooks.press.jhu.edu/title/matrix-computations"]]},
{id:"domain-decomposition",title:"Domain decomposition",level:5,kind:"Parallel numerical",status:"Runnable teaching lab",
 summary:"Domain decomposition splits a physical domain into overlapping or non-overlapping subdomains, solves each in parallel, and iterates at the interfaces.",
 mental:"Cut the problem into pieces and stitch them together",
 mentalText:"Each processor solves a local problem. Information passes across interfaces until the global solution is consistent.",
 steps:["Partition the domain.","Solve local problems with boundary data from neighbours.","Exchange interface values.","Iterate until the interface converges."],
 pseudo:"Overlapping Schwarz (additive):\n  for each subdomain i:\n    solve local problem with boundary from neighbours\n  combine with weights\n  iterate until convergence\n\nNon-overlapping (substructuring):\n  eliminate interior unknowns\n  solve for interface unknowns\n\nCoarse-grid correction is essential for scalability.\nWithout a coarse problem, iteration count grows with\nnumber of subdomains.\n\nCommon methods:\n  Schwarz methods\n  FETI, BDDC\n  Multigrid (see numerical lab)\n\nUsed for PDEs on large parallel machines.",
 uses:"Parallel PDE solvers, structural analysis, CFD, weather simulation.",
 strength:"Natural parallel decomposition. Scalable with proper coarse correction.",
 limits:"Needs a coarse problem for scalability. Interface communication can dominate.",
 pitfall:"Ignoring the coarse grid. Iteration count grows linearly with the number of subdomains.",
 question:"Why is a coarse grid important in domain decomposition?",
 answer:"It carries global information between distant subdomains. Without it, iteration count grows with the number of subdomains.",
 demo:"domain-decomposition",sample:"16\n4\n5",refs:[
  ["Smith, Bjorstad, Gropp, Domain Decomposition: Parallel Multilevel Methods for Elliptic PDEs, Cambridge 1996","https://www.cambridge.org/core/books/domain-decomposition/"],
  ["Toselli and Widlund, Domain Decomposition Methods: Algorithms and Theory, Springer 2005","https://link.springer.com/book/10.1007/b137868"],
  ["Dolean, Jolivet, Nataf, An Introduction to Domain Decomposition Methods, SIAM 2015","https://epubs.siam.org/doi/book/10.1137/1.9781611974065"]]},
/* Ch 6 */
{id:"mapreduce",title:"MapReduce",level:3,kind:"Distributed data",status:"Runnable teaching lab",
 summary:"MapReduce processes large datasets by a map phase that emits key-value pairs, a shuffle that groups by key, and a reduce phase that combines values per key.",
 mental:"Map, group by key, reduce",
 mentalText:"The map emits (k, v) pairs. The shuffle groups all values for the same k. The reduce combines them.",
 steps:["Split the input.","Map each split into (k, v) pairs.","Shuffle: group by key.","Reduce each key's value list.","Write the outputs."],
 pseudo:"MapReduce job:\n  map(k1, v1) -> list(k2, v2)\n  shuffle: group by k2\n  reduce(k2, list(v2)) -> list(v3)\n\nExample (word count):\n  map(doc_id, text):\n    for word in text.split():\n      emit(word, 1)\n  reduce(word, counts):\n    emit(word, sum(counts))\n\nFault tolerance:\n  re-execute failed map tasks\n  reducers pull from completed maps\n\nCombiners:\n  local reduce before shuffle to reduce network traffic\n\nHadoop, Spark, and many other systems\nimplement this model.",
 uses:"Batch data processing, log analysis, indexing, analytics.",
 strength:"Simple model with automatic fault tolerance.",
 limits:"Not ideal for iterative algorithms or low-latency queries.",
 pitfall:"Skipping the combiner. Without it, the shuffle moves far more data.",
 question:"What does a combiner do?",
 answer:"It runs a partial reduce on the map output before shuffle, reducing network traffic.",
 demo:"mapreduce",sample:"the quick brown fox jumps over the lazy dog\nthe dog barks and the fox runs",refs:[
  ["Dean and Ghemawat, MapReduce: simplified data processing on large clusters, OSDI 2004","https://research.google/pubs/pub62/"],
  ["White, Hadoop: The Definitive Guide, 4th ed., O'Reilly 2015","https://www.oreilly.com/library/view/hadoop-the-definitive/9781491901687/"],
  ["Zaharia et al., Resilient Distributed Datasets, NSDI 2012","https://www.usenix.org/conference/nsdi12/technical-sessions/presentation/zaharia"]]},
{id:"spark-dataflow",title:"Dataflow and Spark execution",level:4,kind:"Distributed data",status:"Runnable teaching lab",
 summary:"Dataflow systems build a DAG of transformations and evaluate it lazily. Spark's RDDs track lineage so that lost partitions can be recomputed.",
 mental:"Build a graph of operations, execute it all at once",
 mentalText:"Transformations are lazy. Only when an action is called does the system schedule the computation.",
 steps:["Build a DAG of transformations.","An action triggers execution.","Split into stages at shuffle boundaries.","Schedule tasks across executors.","Recompute lost partitions from lineage."],
 pseudo:"Spark execution model:\n  RDDs form a DAG\n  transformations (map, filter, join) build the DAG lazily\n  actions (count, collect, save) trigger a job\n\n  A job is split into stages at shuffle boundaries.\n  Each stage contains tasks that run in parallel.\n\n  Lineage:\n    each RDD knows how to rebuild its partitions\n    if a partition is lost, re-run its parent computations\n\n  Narrow vs wide dependencies:\n    narrow: each parent partition feeds one child\n      (map, filter) - can be pipelined\n    wide: many parents feed one child\n      (groupByKey, join) - requires shuffle",
 uses:"Large-scale data processing, ETL, ML feature pipelines, graph analytics.",
 strength:"Lazy evaluation enables optimization. Lineage gives fault tolerance without replication.",
 limits:"Shuffles are expensive. Skewed keys can stall tasks.",
 pitfall:"Using groupByKey when reduceByKey would suffice moves too much data over the network.",
 question:"What is the difference between narrow and wide dependencies in Spark?",
 answer:"Narrow dependencies allow pipelining. Wide dependencies require a shuffle and split stages.",
 demo:"spark",sample:"1 the quick brown fox\n2 the lazy dog\n3 the fox and the dog",refs:[
  ["Zaharia et al., Resilient Distributed Datasets, NSDI 2012","https://www.usenix.org/conference/nsdi12/technical-sessions/presentation/zaharia"],
  ["Armbrust et al., Spark SQL: relational data processing in Spark, SIGMOD 2015","https://doi.org/10.1145/2723372.2742797"],
  ["Akidau et al., The Dataflow Model, VLDB 2015","https://doi.org/10.14778/2824032.2824076"]]},
{id:"partitioning-shuffle",title:"Partitioning and shuffle",level:4,kind:"Distributed data",status:"Runnable teaching lab",
 summary:"Shuffle redistributes data by key across workers. Partitioning decides which worker owns which key. Skewed keys create stragglers.",
 mental:"Sorting mail into buckets by destination",
 mentalText:"Every record is routed to a bucket based on its key. Each worker gets a set of buckets.",
 steps:["Choose a partitioning function (hash, range, custom).","Each mapper sends records to the appropriate reducer.","Reducers merge incoming partitions.","Handle skew with salting or custom partitioners."],
 pseudo:"Hash partitioning:\n  partition = hash(key) mod R\n\nRange partitioning:\n  partition by key ranges\n  each range owns a contiguous key interval\n  good for ordered queries, bad for skew\n\nRound-robin:\n  cycles through partitions\n  good for no-key workloads\n  bad for group-by semantics\n\nSkew handling:\n  salting: append a random suffix to hot keys\n  split hot keys across partitions\n  two-stage aggregation\n\nShuffle cost:\n  network I/O dominates\n  reduce data before shuffle (combiners)",
 uses:"MapReduce, Spark, Flink, Kafka, distributed databases.",
 strength:"Simple models with tunable granularity.",
 limits:"Hot keys create stragglers. Range partitioning can create very uneven shards.",
 pitfall:"Assuming uniform key distribution. Real data has skew.",
 question:"What is data skew and why does it matter?",
 answer:"Some keys have far more records than others. The worker owning a hot key becomes a straggler, slowing the whole job.",
 demo:"shuffle",sample:"20\n4\nalpha,beta,gamma,delta,epsilon,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot,hot",refs:[
  ["Dean and Ghemawat, MapReduce, OSDI 2004","https://research.google/pubs/pub62/"],
  ["Kwon et al., SkewTune: mitigating skew in MapReduce applications, SIGMOD 2012","https://doi.org/10.1145/2213836.2213840"],
  ["Zaharia et al., Spark, NSDI 2012","https://www.usenix.org/conference/nsdi12/technical-sessions/presentation/zaharia"]]},
/* Ch 7 */
{id:"lamport-vector",title:"Lamport and vector clocks",level:4,kind:"Distributed clocks",status:"Runnable teaching lab",
 summary:"Lamport clocks give a total order consistent with causality. Vector clocks give the partial order itself: you can tell whether two events are causally related or concurrent.",
 mental:"Numbering events, or tracking who knows what",
 mentalText:"Lamport: increment a counter on each event and on send/receive. Vector: keep a counter per process.",
 steps:["Lamport: for a local event, c += 1. On send, c += 1 and include c. On receive, c = max(local, received) + 1.","Vector: each process has a vector of counters. On send, increment own entry. On receive, take elementwise max and increment own entry."],
 pseudo:"Lamport clock:\n  local event: c += 1\n  send: c += 1, send(c)\n  receive(m): c = max(c, m.c) + 1\n\n  If a -> b, then L(a) < L(b).\n  Converse is not true: L(a) < L(b) does not imply a -> b.\n\nVector clock (one counter per process):\n  local event: V[i] += 1\n  send: V[i] += 1, send(V)\n  receive(m): for each k: V[k] = max(V[k], m.V[k]); V[i] += 1\n\n  V(a) < V(b) iff a -> b\n  V(a) || V(b) iff concurrent\n\nApplications:\n  causal ordering, distributed debugging, conflict detection",
 uses:"Distributed debugging, causal delivery, conflict detection in eventual consistency.",
 strength:"Vector clocks capture the full causal partial order.",
 limits:"Vector clocks grow linearly with the number of processes.",
 pitfall:"Lamport clocks give a total order that is consistent with causality but does not detect concurrency. Use vector clocks for that.",
 question:"What is the key difference between Lamport and vector clocks?",
 answer:"Lamport clocks only give a total order. Vector clocks detect concurrency: two events with incomparable vectors are concurrent.",
 demo:"vector-clock",sample:"3\nA sends B\nB sends C\nC sends A\nA sends C",refs:[
  ["Lamport, Time, clocks, and the ordering of events in a distributed system, CACM 1978","https://doi.org/10.1145/359545.359563"],
  ["Mattern, Virtual time and global states of distributed systems, 1989","https://doi.org/10.1016/B978-0-444-88074-1.50017-9"],
  ["Fidge, Timestamps in message-passing systems that preserve the partial ordering, 1988","https://doi.org/10.1080/00049158808903093"]]},
{id:"hlc",title:"Hybrid logical clocks",level:5,kind:"Distributed clocks",status:"Runnable teaching lab",
 summary:"Hybrid logical clocks (HLC) combine physical time with a logical counter. They provide a total order close to wall clock time and remain monotonic even when clocks drift.",
 mental:"Physical time with a logical correction",
 mentalText:"Each timestamp is a pair (physical_time, logical_counter). The counter breaks ties and handles clock skew.",
 steps:["On a local event, set l' = max(l, physical_now). If l' == l, increment c; else reset c = 0.","On send, include (l, c). On receive, take the max of the local and remote physical times, then adjust the counter."],
 pseudo:"HLC timestamp: (l, c)\n  l: physical time component (milliseconds)\n  c: logical counter\n\nSend or local event:\n  l' = max(l, pt)\n  if l' == l: c += 1\n  else: c = 0\n  l = l'\n\nReceive (l_m, c_m):\n  l' = max(l, l_m, pt)\n  if l' == l == l_m: c = max(c, c_m) + 1\n  elif l' == l: c += 1\n  elif l' == l_m: c = c_m + 1\n  else: c = 0\n  l = l'\n\nProperties:\n  monotonic even when physical clocks go backwards\n  close to physical time (bounded by clock skew)\n  total order via (l, c)\n\nUsed in:\n  CockroachDB, MongoDB, Yugabyte",
 uses:"Distributed databases with a single logical timeline anchored to physical time.",
 strength:"Monotonic and close to wall clock. Handles clock drift.",
 limits:"Still relies on bounded clock skew for the physical component.",
 pitfall:"Assuming HLC timestamps reflect real time exactly. They can drift from physical time when clocks are skewed.",
 question:"How does HLC differ from a Lamport clock?",
 answer:"HLC carries a physical time component that stays close to wall clock, while a Lamport clock only counts events.",
 demo:"hlc",sample:"1000\n950\n3",refs:[
  ["Kulkarni, Demirbas, Madappa, Avva, Leone, Logical physical clocks, OPODIS 2014","https://doi.org/10.1007/978-3-319-14472-6_2"],
  ["CockroachDB documentation, Hybrid Logical Clock","https://www.cockroachlabs.com/docs/stable/architecture/transaction-layer"],
  ["MongoDB documentation, Hybrid Logical Clock","https://www.mongodb.com/docs/manual/core/replica-set-high-availability/"]]},
{id:"chandy-lamport",title:"Chandy-Lamport snapshots",level:5,kind:"Snapshots",status:"Runnable teaching lab",
 summary:"The Chandy-Lamport algorithm takes a consistent global snapshot of a distributed system without stopping processes. Markers flow through the channels to separate pre-snapshot from post-snapshot messages.",
 mental:"A distributed photograph taken without freezing time",
 mentalText:"A process records its state and sends a marker on each outgoing channel. Messages received before the marker are included; after, they are not.",
 steps:["Any process starts by recording its state and sending markers.","A process receiving its first marker records its state and forwards markers.","A process records the state of each incoming channel until the marker arrives on it.","When all markers arrive, the snapshot is complete."],
 pseudo:"Chandy-Lamport:\n  Initiator:\n    record local state\n    for each outgoing channel C:\n      send marker on C\n\n  On receiving marker on channel C for the first time:\n    if state not recorded:\n      record local state\n      send marker on all outgoing channels\n    start recording messages from C\n\n  On receiving marker on channel C after state recorded:\n    stop recording; recorded messages are C's channel state\n\nResult: a consistent cut.\n  every message received in the snapshot was sent in the snapshot.\n\nTermination: distributed termination detection.",
 uses:"Distributed debugging, checkpointing, global state detection.",
 strength:"Consistent snapshot without stopping the system.",
 limits:"Channel state can be large. Not directly a distributed checkpoint for restart.",
 pitfall:"Forgetting to record messages in-flight. They become part of the channel state.",
 question:"Why does Chandy-Lamport produce a consistent snapshot?",
 answer:"Markers separate messages into pre- and post-snapshot. Each process records messages on an incoming channel only until the marker arrives.",
 demo:"chandy-lamport",sample:"3\n4",refs:[
  ["Chandy and Lamport, Distributed snapshots: determining global states of distributed systems, ACM TOCS 1985","https://doi.org/10.1145/214451.214456"],
  ["Mattern, Efficient algorithms for distributed snapshots and global virtual time approximation, JPDC 1993","https://doi.org/10.1006/jpdc.1993.1075"],
  ["Lynch, Distributed Algorithms, Morgan Kaufmann 1996","https://www.sciencedirect.com/book/9781558603486/distributed-algorithms"]]},
/* Ch 8 */
{id:"paxos",title:"Paxos",level:5,kind:"Consensus",status:"Runnable teaching lab",
 summary:"Paxos reaches agreement on a single value in an asynchronous system with crash faults. A proposer needs a majority of acceptors to promise, then a majority to accept.",
 mental:"Two rounds of majority voting",
 mentalText:"Prepare: ask acceptors to promise not to accept lower-numbered proposals. Accept: send the value; acceptors accept if their promise holds.",
 steps:["Proposer picks a unique proposal number n.","Prepare: send to acceptors.","Acceptors promise to ignore lower proposals and return any accepted value.","Proposer picks the highest-numbered accepted value (or its own) and sends Accept.","Acceptors accept if n is higher than any previously accepted proposal.","Consensus when a majority has accepted."],
 pseudo:"Prepare phase:\n  Proposer -> all: Prepare(n)\n  Acceptor:\n    if n > promised:\n      promised = n\n      reply Promise(n, accepted_value, accepted_num)\n    else:\n      reply NACK\n\nAccept phase:\n  Proposer -> all: Accept(n, v)\n    v = highest accepted value from any promise, or proposer's value\n  Acceptor:\n    if n >= promised:\n      promised = n\n      accepted_value = v\n      accepted_num = n\n      reply Accepted(n, v)\n\nSafety: two majorities intersect, so at least one acceptor\nhas seen any previously chosen value.\n\nLiveness: requires a leader. Without a stable leader,\nproposers can livelock.\n\nPaxos is single-value. Multi-Paxos extends it to a log.",
 uses:"Distributed databases, coordination services (Chubby, Spanner, ZooKeeper has ZAB).",
 strength:"Proven safe under crash faults in asynchronous systems.",
 limits:"Hard to understand and implement. Livelock without a leader.",
 pitfall:"Not using a stable leader. Multiple proposers can keep each other from making progress.",
 question:"Why does Paxos need two phases?",
 answer:"Prepare learns any previously accepted value. Accept commits the value with a majority. Two phases make the protocol safe under asynchrony.",
 demo:"paxos",sample:"5\nA",refs:[
  ["Lamport, The part-time parliament, ACM TOCS 1998","https://doi.org/10.1145/279227.279229"],
  ["Lamport, Paxos made simple, ACM SIGACT News 2001","https://lamport.azurewebsites.net/pubs/paxos-simple.pdf"],
  ["Chandra, Griesemer, Redstone, Paxos made live, PODC 2007","https://doi.org/10.1145/1281100.1281103"]]},
{id:"raft",title:"Raft",level:4,kind:"Consensus",status:"Runnable teaching lab",
 summary:"Raft is a consensus algorithm designed for understandability. It elects a leader, replicates a log, and applies committed entries to a state machine.",
 mental:"A leader with followers",
 mentalText:"One leader receives client requests, appends to its log, and replicates to followers. Once a majority has the entry, it is committed.",
 steps:["Followers wait for a heartbeat from the leader.","If no heartbeat within timeout, a candidate starts an election.","The candidate requests votes. Majority vote makes it leader.","Leader receives client requests, appends to log, replicates.","Once a majority acknowledges, the entry is committed."],
 pseudo:"States: Follower, Candidate, Leader\n\nLeader election:\n  Follower times out -> Candidate\n  Candidate increments term, votes for itself, requests votes\n  Majority of votes -> Leader\n  Higher term seen -> become Follower\n\nLog replication:\n  Leader appends entry to its log\n  Sends AppendEntries to followers\n  Followers append and ack\n  Leader commits when majority has the entry\n  Committed entries are applied to the state machine\n\nSafety properties:\n  Election Safety: at most one leader per term\n  Leader Append-Only: leader never overwrites its log\n  Log Matching: if two logs contain an entry with same index and term, all prior entries match\n  Leader Completeness: a leader has all committed entries\n  State Machine Safety: no two state machines apply different entries at the same index",
 uses:"etcd, Consul, TiKV, CockroachDB, many distributed systems.",
 strength:"Easier to understand and implement than Paxos.",
 limits:"Leader is a bottleneck. Leader election causes brief unavailability.",
 pitfall:"Raft is not partition tolerant in the CAP sense: the minority side cannot make progress.",
 question:"What does the Log Matching property guarantee?",
 answer:"If two logs contain an entry with the same index and term, all prior entries are identical.",
 demo:"raft",sample:"5\n20",refs:[
  ["Ongaro and Ousterhout, In search of an understandable consensus algorithm, USENIX ATC 2014","https://www.usenix.org/conference/atc14/technical-sessions/presentation/ongaro"],
  ["Raft website","https://raft.github.io/"],
  ["Ongaro, Consensus: bridging theory and practice, PhD thesis, Stanford 2014","https://web.stanford.edu/~ouster/cgi-bin/papers/OngaroPhD.pdf"]]},
{id:"vr-zab",title:"Viewstamped Replication and Zab",level:5,kind:"Consensus",status:"Runnable teaching lab",
 summary:"Viewstamped Replication is a primary-backup protocol that predates Paxos. Zab is the ZooKeeper Atomic Broadcast protocol; it provides a total order of updates.",
 mental:"A primary that orders and broadcasts updates",
 mentalText:"A primary orders client requests and broadcasts them. A majority accepts, then the primary commits and tells everyone.",
 steps:["Elect a primary.","Primary orders requests and broadcasts proposals.","Replicas accept and acknowledge.","Primary commits when a majority has accepted.","Replicas apply and reply."],
 pseudo:"Viewstamped Replication:\n  View: the primary's term\n  Prepare: elected primary picks a view, gathers state\n  Commit: after a majority accepts, entries are committed\n  ZAB is the atomic broadcast used by ZooKeeper\n\nZab:\n  Phase 1 (election): choose a leader\n  Phase 2 (discovery): synchronize state\n  Phase 3 (broadcast): broadcast updates\n  Each update is assigned a zxid\n\nDifference from Paxos:\n  Zab is for ordered broadcast, not just single-value consensus\n  Simpler for state-machine replication\n  Uses primary-backup, not symmetric proposers",
 uses:"ZooKeeper, systems that need a total order of updates.",
 strength:"Simpler than Paxos for state-machine replication.",
 limits:"Primary is a bottleneck. Leader election is required.",
 pitfall:"Zab and Paxos are often described as the same. They are not: Zab guarantees a prefix of the update order, not just agreement on a value.",
 question:"What is the main difference between Zab and Paxos?",
 answer:"Zab provides a total order over updates (atomic broadcast). Paxos solves single-value consensus and must be extended for logs.",
 demo:"replication",sample:"5\n3",refs:[
  ["Oki and Liskov, Viewstamped replication: a new primary copy method to support highly-available distributed systems, PODC 1988","https://doi.org/10.1145/277697.277716"],
  ["Junqueira, Reed, Serafini, Zab: high-performance broadcast for primary-backup systems, DSN 2011","https://doi.org/10.1109/DSN.2011.5958223"],
  ["Hunt, Konar, Junqueira, Reed, ZooKeeper: wait-free coordination for internet-scale systems, USENIX ATC 2010","https://www.usenix.org/legacy/event/atc10/tech/full_papers/Hunt.pdf"]]},
{id:"chain-replication",title:"Chain replication",level:4,kind:"Replication",status:"Concept lesson",
 summary:"Chain replication arranges replicas in a chain. The head receives writes, forwards down the chain, and the tail sends acknowledgements back. Reads are served by the tail.",
 mental:"A bucket brigade",
 mentalText:"Writes enter at the head and pass down the chain. The tail is always up to date, so reads come from the tail.",
 steps:["A write arrives at the head.","The head applies it, forwards to the next node.","Each node applies and forwards.","The tail applies and sends an acknowledgement back up the chain.","Reads are served by the tail, which has all committed writes."],
 pseudo:"Chain: Head -> Node 2 -> ... -> Tail\n\nWrite path:\n  client -> head\n  head -> node2 -> ... -> tail\n  tail ack -> back to head -> client\n\nRead path:\n  client -> tail\n  tail responds with current value\n\nStrengths:\n  simple to reason about\n  strong consistency (linearizable writes, sequential reads)\n  load spread across the chain for writes\n\nWeaknesses:\n  read throughput limited by the tail\n  tail failure requires reconfiguring the chain\n  latency proportional to chain length for writes",
 uses:"CRAQ (Chain Replication with Apportioned Queries), object stores, some distributed key-value stores.",
 strength:"Simple correctness argument. High write throughput with parallelism.",
 limits:"Read throughput bottleneck. Chain reconfiguration on failure.",
 pitfall:"Assuming head is a bottleneck. In chain replication, writes are spread across all nodes. Reads all hit the tail.",
 question:"Where are reads served in chain replication?",
 answer:"From the tail. The tail has all committed writes, so it can serve reads with strong consistency.",
 demo:"chain",sample:"4\n5",refs:[
  ["van Renesse and Schneider, Chain replication for supporting high throughput and availability, OSDI 2004","https://www.usenix.org/legacy/events/osdi04/tech/full_papers/renesse/renesse.pdf"],
  ["Terrace and Freedman, Object storage on CRAQ: high-throughput chain replication for read-mostly workloads, USENIX ATC 2009","https://www.usenix.org/legacy/event/atc09/tech/full_papers/terrace.pdf"],
  ["Lynch, Distributed Algorithms, Chapter 14","https://www.sciencedirect.com/book/9781558603486/distributed-algorithms"]]},
/* Ch 9 */
{id:"two-three-phase-commit",title:"Two-phase and three-phase commit",level:4,kind:"Transactions",status:"Runnable teaching lab",
 summary:"Two-phase commit (2PC) coordinates a transaction across multiple participants. Three-phase commit (3PC) adds a pre-commit phase to reduce blocking under failures.",
 mental:"Vote then commit",
 mentalText:"Phase 1: every participant votes yes or no. Phase 2: the coordinator commits if everyone voted yes, otherwise aborts.",
 steps:["Coordinator sends prepare to participants.","Each participant locks and votes yes or no.","Coordinator collects votes.","If all yes: send commit. Else: send abort.","Participants apply and release locks."],
 pseudo:"2PC:\n  Phase 1 (prepare):\n    Coordinator -> participants: prepare\n    Participant: lock, log, vote yes or no\n\n  Phase 2 (commit):\n    if all yes:\n      Coordinator -> all: commit\n      Participant: apply, ack\n    else:\n      Coordinator -> all: abort\n      Participant: rollback, ack\n\nBlocking problem:\n  if coordinator fails after prepare but before commit,\n  participants hold locks and cannot decide.\n  They block until coordinator recovers.\n\n3PC:\n  add a pre-commit phase between prepare and commit\n  allows participants to time out and decide\n  but requires a failure detector\n  and does not solve network partitions",
 uses:"Distributed databases, distributed transactions, XA.",
 strength:"Simple. Works well when failures are rare.",
 limits:"Blocking on coordinator failure. No partition tolerance.",
 pitfall:"2PC is a blocking protocol. Under failures, participants can hang.",
 question:"Why does 2PC block under coordinator failure?",
 answer:"After voting yes, participants have locked resources but do not know whether to commit or abort. They must wait for the coordinator.",
 demo:"2pc",sample:"3\n2",refs:[
  ["Gray, Notes on data base operating systems, in Operating Systems, Springer 1978","https://link.springer.com/chapter/10.1007/3-540-08755-9_9"],
  ["Bernstein, Hadzilacos, Goodman, Concurrency Control and Recovery in Database Systems, Addison-Wesley 1987","https://www.microsoft.com/en-us/research/people/philbe/book/"],
  ["Lampson and Lomet, A new presumed commit optimization for two phase commit, VLDB 1993","https://www.vldb.org/conf/1993/P630.PDF"]]},
{id:"swim-phi",title:"SWIM and phi-accrual failure detection",level:4,kind:"Failure detection",status:"Runnable teaching lab",
 summary:"SWIM detects failures with a gossip-based protocol and suspicion. Phi-accrual replaces the binary alive/dead decision with a continuous suspicion level based on arrival-time statistics.",
 mental:"Gossip about who is alive, and how suspicious we are",
 mentalText:"SWIM: ping, indirect ping, and gossip to spread membership. Phi-accrual: compute a suspicion value from the distribution of ping inter-arrival times.",
 steps:["SWIM: periodically ping a random member.","If no response, ask k others to ping it indirectly.","If still nothing, mark as suspect and gossip.","Phi-accrual: track heartbeat arrival times, compute phi = -log10(1 - F(time_since_last))."],
 pseudo:"SWIM:\n  every T: pick a random member, ping\n  if no ack within timeout:\n    pick k others, ask them to ping\n    if still no ack: mark suspect\n  gossip the suspicion to random members\n\n  Suspicion can be refuted by a direct message.\n  Handles false positives and message loss.\n\nPhi-accrual:\n  maintain samples of inter-arrival times\n  mean mu, variance sigma^2\n  t = time since last heartbeat\n  F(t) = estimated CDF\n  phi = -log10(1 - F(t))\n\n  threshold phi > 8 to declare dead\n  adapts to network conditions",
 uses:"Cluster membership (Cassandra, Akka, HashiCorp Serf).",
 strength:"Handles false positives and network jitter gracefully.",
 limits:"Phi parameter must be tuned. Slow detection at low threshold, false positives at high.",
 pitfall:"Treating a suspect as dead. In SWIM, suspicion can be refuted.",
 question:"What is the key idea behind phi-accrual?",

{id:"rcu-hazard",title:"RCU and hazard pointers",level:5,kind:"Memory reclamation",status:"Runnable teaching lab",

import threading

counter = 0

def broken_increment():
    global counter
    old = counter               # both threads read the same value
    read_barrier.wait()         # force both reads to happen before either write
    counter = old + 1           # one increment is lost

threads = [threading.Thread(target=broken_increment) for _ in range(2)]

    global counter
    with lock:

 "reduce":{python:`from functools import reduce\n\n\ndef tree_reduce(a, op):\n    a = list(a)\n    while len(a) > 1:\n        a = [op(a[i], a[i+1]) for i in range(0, len(a) - 1, 2)] + ([a[-1]] if len(a) % 2 else [])\n    return a[0]\n\n\ndata = list(range(1, 9))\nprint("sequential reduce:", reduce(lambda x, y: x + y, data))\nprint("tree reduce:      ", tree_reduce(data, lambda x, y: x + y))\n\n# Show depth\nn = len(data)\ndepth = 0\nwhile n > 1:\n    depth += 1\n    n = (n + 1) // 2\nprint("tree depth:", depth)\n`},
 "scan":{python:`def inclusive_scan(x, op):\n    out = list(x)\n    n = len(out)\n    d = 1\n    while d < n:\n        new = list(out)\n        for i in range(n):\n            if i >= d:\n                new[i] = op(out[i - d], out[i])\n        out = new\n        d *= 2\n    return out\n\n\ndata = [3, 1, 4, 1, 5, 9, 2, 6]\nprint("inclusive scan (sum):", inclusive_scan(data, lambda a, b: a + b))\n`},
 "blelloch":{python:`def blelloch_exclusive_scan(values, identity=0):
    # Pad to a power of two, then remove padding from the result.
    values = list(values)
    original_length = len(values)
    if not values:
        return []
    size = 1
    while size < original_length:
        size *= 2
    a = values + [identity] * (size - original_length)

    # Up-sweep: build subtree reductions.
    d = 1
    while d < size:
        for i in range(0, size, 2 * d):
            a[i + 2*d - 1] += a[i + d - 1]
        d *= 2

    # Down-sweep: propagate exclusive prefixes.
    a[size - 1] = identity
    d = size // 2
    while d >= 1:
        for i in range(0, size, 2 * d):
            left = i + d - 1
            right = i + 2*d - 1
            temp = a[left]
            a[left] = a[right]
            a[right] += temp
        d //= 2

 hlc(input){const v=parseInputNums(input,3),physical=Math.floor(v[0]),remotePhysical=Math.floor(v[1]),remoteCounter=Math.floor(clamp(v[2],0,1e9));const local=[physical-5,1],remote=[remotePhysical,remoteCounter],now=physical;const L=Math.max(now,local[0],remote[0]);let C;if(L===local[0]&&L===remote[0])C=Math.max(local[1],remote[1])+1;else if(L===local[0])C=local[1]+1;else if(L===remote[0])C=remote[1]+1;else C=0;return [`Assumed local timestamp before receive: (${local[0]}, ${local[1]})`,`Incoming timestamp: (${remote[0]}, ${remote[1]})`,`Local physical clock now: ${now}`,`HLC after receive: (${L}, ${C})`,"The physical component advances when possible. The logical counter preserves ordering when physical timestamps tie or move backward."] .join("\n");},
 "chandy-lamport"(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],2,10)),messages=Math.floor(clamp(v[1],0,30)),out=[`Processes: ${n}`,`Illustrative messages in system: ${messages}`,"","1. Initiator P0 records its local state and sends markers."];for(let i=1;i<n;i++)out.push(`${i+2}. P${i} records local state on first marker and forwards markers on outgoing channels.`);out.push(`${n+2}. Each incoming channel records messages until its marker arrives.`,"","Snapshot records:",...Array.from({length:n},(_,i)=>`  P${i}: local state recorded; ${Math.max(0,Math.floor(messages/n))} illustrative in-flight message(s) per channel`),"","This is a timeline illustration, not a full asynchronous channel-level implementation. The real algorithm relies on reliable FIFO channels.");return out.join("\n");},
 paxos(input){const l=lines(input),n=Math.floor(clamp(num(l[0],5),1,101)),proposal=(l[1]||"A").slice(0,100),quorum=Math.floor(n/2)+1;return [`Single-decree Paxos walkthrough`, `Acceptors: ${n}`,`Proposal value: ${proposal}`,`Majority quorum: ${quorum}`,"","1. Proposer sends PREPARE with a proposal number.",`2. If at least ${quorum} acceptors promise, proposer may send ACCEPT.`, `3. In this no-prior-accepted-value example, acceptors accept ${JSON.stringify(proposal)}.`, `4. Once ${quorum} acceptors accept the proposal, the value is chosen.`,"","This is a teaching model of one successful round. Real Paxos must preserve previously accepted values and handle competing proposers, retries, message loss, and crashes."] .join("\n");},
 replication(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],1,100)),ops=Math.floor(clamp(v[1],1,100));const q=Math.floor(n/2)+1;const out=[`Replicas: ${n}`,`Operations: ${ops}`,`Majority quorum: ${q}`,""];for(let i=1;i<=ops;i++)out.push(`Entry ${i}: append op-${i} at leader → replicate to ${n-1} follower(s) → ${n} acknowledgements → commit`);out.push("","This abstracts the state-machine replication pattern. Viewstamped Replication and Zab have different detailed view-change and recovery rules.");return out.join("\n");},
 raft(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],1,101)),rounds=Math.floor(clamp(v[1],1,1e5)),candidate=(rounds*7+3)%n,quorum=Math.floor(n/2)+1;return [`Raft election walkthrough`,`Cluster size: ${n}`,`Illustrative timeout seed: ${rounds}`,`Candidate: node ${candidate}`,`Votes in a fully connected cluster: ${n}`,`Majority required: ${quorum}`,`Result: ${n>=quorum?`node ${candidate} can become leader in this simplified scenario`:"no majority is possible"}`,"","This demonstrates the majority rule, not a full Raft implementation. Real Raft also checks log freshness, persists terms and votes, and steps down when it learns of a higher term."] .join("\n");},
 chain(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],1,100)),writes=Math.floor(clamp(v[1],1,100));const out=[`Replicas in chain: ${n}`,`Writes: ${writes}`,""];for(let i=1;i<=writes;i++)out.push(`write-${i}: head accepts → forwards through ${Math.max(0,n-1)} follower(s) → tail acknowledges → commit`);out.push("","A chain-replication design commonly serves reads from the tail so clients observe committed state. Failover and reconfiguration require additional protocol rules.");return out.join("\n");},
 "2pc"(input){const v=parseInputNums(input,1),n=Math.floor(clamp(v[0],1,100)),fail=Math.floor(v[1]??0),out=[`Participants: ${n}`,`Simulated no-vote participant: ${fail>=1&&fail<=n?fail:"none"}`,"","Phase 1: PREPARE"];for(let i=1;i<=n;i++)out.push(`  P${i} → ${i===fail?"NO / cannot prepare":"YES / prepared"}`);const commit=!(fail>=1&&fail<=n);out.push("",`Phase 2: ${commit?"COMMIT":"ABORT"}`,...Array.from({length:n},(_,i)=>`  P${i+1}: ${commit?"committed":"aborted"}`),"","Two-phase commit can block if the coordinator fails while participants are prepared. Three-phase commit adds a pre-commit phase but needs stronger timing and failure assumptions.");return out.join("\n");},
 swim(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],2,100)),rounds=Math.floor(clamp(v[1],1,10000)),failed=(rounds*13+1)%n;return [`Nodes: ${n}`,`Probe rounds: ${rounds}`,`Illustrative failed node: ${failed}`,`Direct probes attempted: ${rounds}`,`Indirect probes may be tried after a direct timeout.`,"","After repeated failed probes, peers may mark the node suspected, then dead. Suspicion is a failure detector signal, not mathematical proof that a process has crashed.","This is a simplified teaching model, not the full SWIM membership protocol or phi-accrual detector."] .join("\n");},
 merkle(input){const count=Math.floor(clamp(num(lines(input)[0],8),1,1024));let level=Array.from({length:count},(_,i)=>hash32(`leaf-${i}`).toString(16).padStart(8,"0"));const initial=level.slice();const out=[`Leaves: ${count}`,"Leaf fingerprints:",...level.slice(0,16).map((h,i)=>`  leaf-${i}: ${h}`)];while(level.length>1){if(level.length%2)level.push(level[level.length-1]);const next=[];for(let i=0;i<level.length;i+=2)next.push(hash32(level[i]+level[i+1]).toString(16).padStart(8,"0"));level=next;}const root=level[0];initial[Math.floor(count/2)]="changed-leaf";level=initial.map(x=>hash32(x).toString(16).padStart(8,"0"));while(level.length>1){if(level.length%2)level.push(level[level.length-1]);const next=[];for(let i=0;i<level.length;i+=2)next.push(hash32(level[i]+level[i+1]).toString(16).padStart(8,"0"));level=next;}out.push("",`Illustrative root: ${root}`,`Root after one leaf changes: ${level[0]}`,"","The visualizer uses a small non-cryptographic hash so it works offline and quickly. Production Merkle trees must use a collision-resistant cryptographic hash and a clearly defined tree encoding.");return out.join("\n");},
 "consistent-hashing"(input){const v=parseInputNums(input,3),keysCount=Math.floor(clamp(v[0],1,100000)),vnodes=Math.floor(clamp(v[1],1,1000)),n=Math.floor(clamp(v[2],1,100));const makeRing=nodes=>{const ring=[];nodes.forEach(node=>{for(let i=0;i<vnodes;i++)ring.push({point:hash32(`${node}-${i}`),node});});return ring.sort((a,b)=>a.point-b.point);};const owner=(ring,key)=>{const h=hash32(key);return (ring.find(x=>x.point>=h)||ring[0]).node;};const oldNodes=Array.from({length:n},(_,i)=>`N${i}`),newNodes=[...oldNodes,`N${n}`],r1=makeRing(oldNodes),r2=makeRing(newNodes);let moved=0;const counts={};for(let i=0;i<Math.min(keysCount,100000);i++){const key=`key-${i}`,a=owner(r1,key),b=owner(r2,key);if(a!==b)moved++;counts[b]=(counts[b]||0)+1;}return [`Keys tested: ${keysCount}`,`Virtual nodes per server: ${vnodes}`,`Servers before / after: ${n} / ${n+1}`,`Keys reassigned when one server is added: ${moved} (${(moved/keysCount*100).toFixed(2)}%)`,"New ownership counts:",...Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,x])=>`  ${k}: ${x}`),"","This deterministic 32-bit hash is used only for illustration. More virtual nodes generally smooth distribution; hot keys remain a separate problem."].join("\n");},
 chord(input){const v=parseInputNums(input,4),bits=Math.floor(clamp(v[0],4,20)),n=Math.floor(clamp(v[1],2,1000)),key=Math.floor(clamp(v[2],0,2**bits-1)),requested=Math.floor(clamp(v[3],1,10000)),space=2**bits,nodes=Array.from({length:n},(_,i)=>Math.floor(i*space/n)).sort((a,b)=>a-b),owner=nodes.find(x=>x>=key)??nodes[0];const hops=Math.min(n,Math.ceil(Math.log2(n))+1);return [`Identifier bits: ${bits}`,`Ring size: ${space}`,`Nodes: ${nodes.join(", ")}`,`Key ID: ${key}`,`Successor responsible for key: ${owner}`,`Illustrative lookup budget: ${requested}`,`Typical lookup scaling: O(log n), around ${hops} hops for ${n} well-maintained nodes`,"","This uses evenly spaced node IDs to keep the visual deterministic. Real Chord uses hashed identifiers, finger tables, and stabilization under churn."] .join("\n");},
 kademlia(input){const v=parseInputNums(input,4),bits=Math.floor(clamp(v[0],4,20)),n=Math.floor(clamp(v[1],2,1000)),k=Math.floor(clamp(v[2],1,100)),target=Math.floor(clamp(v[3],0,2**bits-1)),space=2**bits,nodes=Array.from({length:n},(_,i)=>Math.floor((i+0.37)*space/n)),ranked=nodes.map(node=>({node,distance:(node^target)>>>0})).sort((a,b)=>a.distance-b.distance);return [`ID bits: ${bits}`,`Nodes: ${n}`,`Bucket size k: ${k}`,`Target ID: ${target}`,"Closest peers by XOR distance:",...ranked.slice(0,Math.min(k,8)).map(x=>`  node ${x.node}: distance ${x.distance} (binary ${x.distance.toString(2).padStart(bits,"0")})`),"","Kademlia repeatedly queries a small alpha-sized set of the closest known peers until no closer peer is found. This is a static lookup illustration, not a live network simulation."].join("\n");},
 leader(input){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],2,10000)),initiator=Math.floor(clamp(v[1],0,n-1)),higher=n-initiator-1;return [`Processes: P0 to P${n-1}`,`Election initiator: P${initiator}`,`Higher-ID processes notified: ${higher}`,`OK replies expected: ${higher}`,`Elected leader under the no-failure bully model: P${n-1}`,`Approximate messages in this simple bully run: ${higher*2+1}`,"","In Chang-Roberts, candidate IDs move around a ring and the highest participating ID wins. Partitions or failures can change the assumptions and require recovery logic."] .join("\n");},
 crdt(input){const l=lines(input),type=(l[0]||"counter").toLowerCase(),replicas=(l[1]||"A B C").split(/[\s,]+/).filter(Boolean).slice(0,20);if(type.includes("set")){const sets=replicas.map((r,i)=>({r,values:[`${r}-item`,...(i===0?["shared"]:[])]}));return [`CRDT type: grow-only set`,`Replicas: ${replicas.join(", ")}`,"Local sets:",...sets.map(s=>`  ${s.r}: {${s.values.join(", ")}}`),`Merged set: {${[...new Set(sets.flatMap(s=>s.values))].join(", ")}}`,"The merge takes the set union, which is associative, commutative, and idempotent."].join("\n");}const counts=Object.fromEntries(replicas.map((r,i)=>[r,i+1]));return [`CRDT type: grow-only counter (G-Counter)`,`Replicas: ${replicas.join(", ")}`,"Local increments:",...Object.entries(counts).map(([r,c])=>`  ${r}: ${c}`),`Merged counter: ${Object.values(counts).reduce((a,b)=>a+b,0)}`,"Merge rule: take the component-wise maximum, then sum the components. This differs from simply adding replica totals, which could double-count duplicated state."] .join("\n");},
 "bft-quorum"(input,lesson){const v=parseInputNums(input,2),n=Math.floor(clamp(v[0],1,10000)),requestedF=Math.floor(clamp(v[1],0,10000)),maxF=Math.floor((n-1)/3),f=Math.min(requestedF,maxF),quorum=2*f+1;return [`Topic: ${lesson.title}`,`Replicas n: ${n}`,`Faults requested f: ${requestedF}`,`Maximum Byzantine faults satisfying n ≥ 3f + 1: ${maxF}`,`Configured f: ${f}`,`Byzantine quorum: ${quorum}`,`n ≥ 3f + 1 holds for configured f: ${n>=3*f+1}`,"","For the classical Byzantine model, at least 3f+1 replicas and 2f+1 votes are commonly required. Exact thresholds depend on the protocol and its assumptions. A simple majority is not enough for arbitrary Byzantine faults."] .join("\n");},
 rcu(input){const v=parseInputNums(input,2),readers=Math.floor(clamp(v[0],1,100)),updates=Math.floor(clamp(v[1],1,100));return [`Active readers before update: ${readers}`,`Writer updates: ${updates}`,"","1. Writer publishes a replacement pointer.",`2. Old versions are retired, but are not freed while readers may still hold them.`,`3. After each relevant reader exits, the grace period can complete.`,`4. Old storage is reclaimed only when no pre-existing reader can access it.`,"","Hazard pointers use published per-thread pointers instead of an RCU grace period. Both require strict memory-lifetime rules."] .join("\n");},
 epoch(input){const v=parseInputNums(input,2),threads=Math.floor(clamp(v[0],1,1000)),stalled=Math.floor(clamp(v[1],0,threads));const active=Array.from({length:threads},(_,i)=>i<stalled?1:3);return [`Threads: ${threads}`,`Threads still pinned to old epoch: ${stalled}`,`Example active epochs: [${active.slice(0,30).join(", ")}${threads>30?", …":""}]`,`Can reclaim epoch-1 objects now: ${stalled===0?"yes, assuming all other reclamation conditions hold":"no"}`,"","A stalled reader can delay reclamation and allow retired memory to accumulate. Epoch protocols also require careful ordering when a thread announces that it has entered a read-side critical section."] .join("\n");}
};

function initChapterFilter(){const sel=$("#chapterFilter");for(const ch of CHAPTERS){const opt=document.createElement("option");opt.value=ch.id;opt.textContent=ch.title;sel.appendChild(opt);}}
function exportData(){const payload={app:"AZNUR Parallel & Distributed Lab",version:1,exportedAt:new Date().toISOString(),current:state.current,completed:[...state.completed],theme:state.theme,answers:state.answers,notes:state.notes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="aznur-parallel-distributed-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Progress exported as JSON.");}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result));if(!data||typeof data!=="object"||!Array.isArray(data.completed))throw new Error("This file is not a supported progress export.");state.completed=new Set(data.completed.filter(id=>byId[id]));state.current=byId[data.current]?data.current:"";state.theme=["light","dark","system"].includes(data.theme)?data.theme:"dark";state.answers=data.answers&&typeof data.answers==="object"?data.answers:{};state.notes=data.notes&&typeof data.notes==="object"?data.notes:{};saveState();setTheme(state.theme);renderTree();state.current?renderLesson(state.current):renderHome();toast("Progress imported.");}catch(err){toast(err.message||"Could not import that file.");}};reader.onerror=()=>toast("Could not read the selected file.");reader.readAsText(file);}
function runCurrentLab(id){const lesson=byId[id],input=$("#labInput");if(!lesson||!input)return;state.answers[id]=input.value;saveState();try{const result=RUNNERS[getDemoKey(lesson)](input.value,lesson);$("#labOutput").textContent=result;selectTab("lab");}catch(err){$("#labOutput").textContent=`Input error: ${err.message||"Check the format and try again."}`;selectTab("lab");}}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Copied to clipboard.")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const temp=document.createElement("textarea");temp.value=text;temp.style.position="fixed";temp.style.opacity="0";document.body.appendChild(temp);temp.select();try{document.execCommand("copy");toast("Copied to clipboard.");}catch(_){toast("Copy failed. Select the code and copy it manually.");}temp.remove();}
function handleAction(action,el){const id=el.dataset.id||state.current;switch(action){case"continue":renderLesson(LESSONS.find(l=>!state.completed.has(l.id))?.id||LESSONS[0].id);break;case"progress":renderProgress();break;case"toggle-complete":if(state.completed.has(id))state.completed.delete(id);else state.completed.add(id);saveState();renderLesson(id);toast(state.completed.has(id)?"Lesson marked complete.":"Lesson marked incomplete.");break;case"next":{const i=LESSONS.findIndex(l=>l.id===state.current);if(i<LESSONS.length-1)renderLesson(LESSONS[i+1].id);break;}case"prev":{const i=LESSONS.findIndex(l=>l.id===state.current);if(i>0)renderLesson(LESSONS[i-1].id);break;}case"run-lab":runCurrentLab(id);break;case"reset-lab":{const l=byId[id];$("#labInput").value=l.sample||sampleDefaults[getDemoKey(l)]||"";runCurrentLab(id);break;}case"save-note":state.notes[id]=$("#lessonNote")?.value||"";saveState();toast("Notes saved.");break;case"copy-code":{const l=byId[state.current],code=CODE[l?.codeKey||getDemoKey(l)]||CODE[getDemoKey(l)];if(code)copyText(code.python);else toast("No Python example is available for this lesson.");break;}case"reset-progress":if(confirm("Reset all completed lessons? Your notes and lab inputs will be kept.")){state.completed.clear();saveState();renderProgress();toast("Completion progress reset.");}break;}}
document.addEventListener("click",event=>{const tab=event.target.closest("[data-tab]");if(tab){selectTab(tab.dataset.tab);return;}const link=event.target.closest("[data-lesson]");if(link){renderLesson(link.dataset.lesson);return;}const chapter=event.target.closest("[data-chapter]");if(chapter){$("#chapterFilter").value=chapter.dataset.chapter;renderTree();const ch=CHAPTERS.find(c=>c.id===chapter.dataset.chapter);const first=ch&&ch.ids.map(id=>byId[id]).find(Boolean);if(first)renderLesson(first.id);return;}const action=event.target.closest("[data-action]");if(action){handleAction(action.dataset.action,action);return;}const page=event.target.closest("[data-page]");if(page){page.dataset.page==="progress"?renderProgress():renderHome();}});
$("#searchInput").addEventListener("input",renderTree);$("#chapterFilter").addEventListener("change",renderTree);$("#themeSelect").addEventListener("change",e=>setTheme(e.target.value));$("#printBtn").addEventListener("click",()=>window.print());$("#exportBtn").addEventListener("click",exportData);$("#importBtn").addEventListener("click",()=>$("#importFile").click());$("#importFile").addEventListener("change",e=>{const file=e.target.files?.[0];if(file)importData(file);e.target.value="";});$("#homeLink").addEventListener("click",e=>{e.preventDefault();state.current="";saveState();renderTree();renderHome();});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#searchInput").focus();}if(e.key==="Escape"&&document.activeElement===$("#searchInput")){$("#searchInput").value="";renderTree();$("#searchInput").blur();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();exportData();}});
if(typeof matchMedia==="function")matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",()=>{if(state.theme==="system")setTheme("system");});
loadState();initChapterFilter();setTheme(state.theme);updateProgress();renderTree();if(state.current)renderLesson(state.current);else renderHome();
</script></body></html>
